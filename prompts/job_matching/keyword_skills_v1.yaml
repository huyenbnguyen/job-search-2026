# Skill vocabulary for the keyword-overlap baseline (not an LLM prompt).
#
# A generic list of software-engineering skills, written without reference to any one
# resume or to the user's labels. Never edit a version that predictions already use:
# copy it to keyword_skills_v2.yaml instead.
#
# Each skill matches if any of its terms appears as a whole word or phrase:
# - `terms` match in any case. Without `terms` or `exact_case`, the name is the term.
# - `exact_case` match only with this exact capitalization, for names that are also
#   common English words ("Go", "Rust", "Spark").
# Spaces in a term also match hyphens, and a trailing "s" is allowed (API -> APIs).
version: keyword_skills_v1
skills:
