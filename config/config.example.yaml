# Copy to config/config.yaml (gitignored) and adjust. Every key is optional;
# missing keys use the defaults in src/jobsearch/config.py. No secrets here.

database:
  # SQLite file. Keep it outside the repository; it holds your job history.
  path: ~/.local/share/jobsearch/jobsearch.db
  busy_timeout_ms: 5000

ingestion:
  fetch:
    timeout_seconds: 20.0
    max_response_bytes: 5000000
    max_redirects: 5
    # Retries apply only to transient failures: network errors, HTTP 429 and 5xx.
    max_retries: 3
    backoff_base_seconds: 1.0
    # Minimum gap between two requests to the same host.
    per_host_delay_seconds: 2.0
    user_agent: "jobsearch-personal/0.1 (single-user job tracker)"
    # Company career pages are skipped when robots.txt disallows them.
    respect_robots_txt: true

scoring:
  # The rubric scores are compared on, a file in prompts/job_matching/.
  rubric_version: rubric_v1
  keyword_baseline:
    # Skill list in prompts/job_matching/, without the extension.
    vocabulary: keyword_skills_v1
    # Whole percentages of the job's listed skills found in your resume. Each one reached
    # adds a point to a base of 1, so scores are the integers 1-5: below 20% scores 1,
    # 80% or more scores 5. Equal-width bins, not fitted to your labels.
    threshold_percents: [20, 40, 60, 80]

logging:
  # Structured JSON log file. Keep it outside the repository or under data/.
  file: data/logs/jobsearch.log
