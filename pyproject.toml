[project]
name = "jobsearch"
version = "0.1.0"
description = "Local, single-user job search and fit-scoring tool"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "httpx>=0.28",
    "litellm==1.106.7",
    "pydantic>=2.9",
    "pypdf>=7.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.15",
]

[project.scripts]
jobsearch = "jobsearch.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
